# ai-subscriptions - local docker deployment
# Image is built locally from /home/god/ai-subscriptions (make image / make deploy)

services:
  ai-subscriptions:
    image: ai-subscriptions:latest
    container_name: ai-subscriptions
    restart: unless-stopped

    # non-root, matches host user (1000:1000) for volume file ownership
    user: "1000:1000"

    ports:
      - "3000:3000"

    environment:
      DATA_DIR: /data
    env_file:
      - .env

    volumes:
      - ./data:/data

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/api/auth/session",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ai-subscriptions_default
