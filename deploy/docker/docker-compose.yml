# ai-subscriptions - local docker deployment
# Image is built locally from the repository root (make image / make deploy).
# Contract inherited from the old stack: port 3000, /data volume, DATA_DIR,
# non-root 1000:1000, 1 CPU / 512M (see deploy/docker/README.md).

services:
  ai-subscriptions:
    image: ai-subscriptions:latest
    container_name: ai-subscriptions
    restart: unless-stopped

    # non-root, matches host user (1000:1000) for volume file ownership
    user: "1000:1000"

    ports:
      - "3000:3000"

    environment:
      DATA_DIR: /data
    env_file:
      - .env

    volumes:
      - ./data:/data

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    # The runtime image is distroless (no shell, no wget/curl), so the probe is
    # the binary's own `healthcheck` subcommand hitting /api/health on $PORT.
    healthcheck:
      test: ["CMD", "/app/ai-subscriptions", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ai-subscriptions_default
